name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Vitest packages, node:test scripts)
        run: pnpm test

      - name: Rules file schema and verification status
        run: pnpm rules:check

      - name: Glyph data matches the pinned fonts
        run: pnpm glyphs:check

      - name: No secrets in tracked files
        run: pnpm secrets:check

      - name: Rules changes bump the version and re-verify changed rules
        if: github.event_name == 'pull_request'
        run: node scripts/check-rules-change.mjs "origin/${{ github.base_ref }}"
