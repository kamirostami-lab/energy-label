name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Poppler (pdffonts, pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Vitest packages, node:test scripts)
        run: pnpm test

      - name: Rules file schema and verification status
        run: pnpm rules:check

      - name: Glyph data matches the pinned fonts
        run: pnpm glyphs:check

      - name: Exported PDFs have no fonts and measure the panel (Poppler)
        run: pnpm pdf:check

      - name: No secrets in tracked files
        run: pnpm secrets:check

      - name: Rules changes bump the version and re-verify changed rules
        if: github.event_name == 'pull_request'
        run: node scripts/check-rules-change.mjs "origin/${{ github.base_ref }}"

  web:
    # The app in a real browser: build the Worker, run it in workerd with a fresh local D1 database
    # and the sign-in outbox, drive it with Playwright (keyboard-only generate flow, sign-in, SKUs
    # and stored exports, axe-core).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the Worker
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @energy-panel/web exec playwright install --with-deps chromium

      - name: Generator, accounts and accessibility (Playwright, axe-core)
        run: pnpm e2e
        env:
          WRANGLER_SEND_METRICS: 'false'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
